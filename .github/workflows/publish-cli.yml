name: Publish CLI to npm
# Push a tag like cli-v1.0.0 (matching packages/cli/package.json) to publish
# flux-downloader. Needs the NPM_TOKEN repository secret.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx vitest run tests/cli.test.ts
      - run: npm run build:cli
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "cli-v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: node packages/cli/dist/flux.mjs --version
      - run: npm publish ./packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
