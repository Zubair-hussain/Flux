name: Sightline audit
# SEO, link and website-health audit using Sightline
# (https://github.com/Zubair-hussain/Sightline).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: re-check the public site
  workflow_dispatch:
    inputs:
      url:
        description: "Public URL to audit instead of the CI build (optional)"
        required: false
permissions:
  contents: read
concurrency:
  group: sightline-${{ github.ref }}
  cancel-in-progress: true
env:
  SIGHTLINE_REF: ${{ vars.SIGHTLINE_REF || 'main' }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Audit the build exactly as it will be indexed at launch.
      SITE_URL: ${{ vars.FLUX_PUBLIC_URL || 'https://flux.launch.test' }}
      SEO_INDEXABLE: "true"
      # A public URL (manual input or the FLUX_PUBLIC_URL variable on schedule)
      # is audited directly, including HTTPS, HSTS and HTTP/3 checks.
      TARGET: ${{ inputs.url || (github.event_name == 'schedule' && vars.FLUX_PUBLIC_URL) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build Sightline CLI
        run: |
          git clone --depth 1 --branch "$SIGHTLINE_REF" https://github.com/Zubair-hussain/Sightline.git .sightline
          npm ci --prefix .sightline --ignore-scripts --no-audit --no-fund
          npm run build --prefix .sightline
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build and start Flux
        if: env.TARGET == ''
        run: |
          npm ci
          npm run build
          nohup npx next start --hostname 127.0.0.1 --port 3000 > flux.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 1; done
          cat flux.log; exit 1
      - name: Run Sightline on every public page
        run: node scripts/sightline-audit.mjs
        env:
          AUDIT_BASE_URL: ${{ env.TARGET || 'http://127.0.0.1:3000' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sightline-reports
          path: reports/sightline/
