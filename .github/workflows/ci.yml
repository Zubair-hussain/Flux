name: Verify Flux
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            coverage/
            test-results/
  cli:
    name: CLI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: npm run verify:package
      - run: node packages/cli/dist/flux.mjs --version
      - run: node packages/cli/dist/flux.mjs platforms
      - name: Rejects unsupported sites
        shell: bash
        run: |
          if node packages/cli/dist/flux.mjs info https://example.com/video; then exit 1; fi
      - run: npm pack --dry-run ./packages/cli
